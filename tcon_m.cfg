source [find interface/cmsis-dap.cfg]
adapter serial E6616408431E3733
transport select swd
adapter speed 4000

gdb_port 3333
telnet_port 4444
tcl_port 6666

swd newdap chip cpu -expected-id 0
dap create chip.dap -chain-position chip.cpu
target create chip.cpu cortex_m -endian little -dap chip.dap
reset_config none
cortex_m reset_config sysresetreq
